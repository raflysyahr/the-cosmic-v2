<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Offline - The Cosmic</title>
  <style>
    @font-face {
      font-family: 'BitcountGridDouble';
      font-display: swap;
      src: url('/fonts/BitcountGridDouble-Regular.woff2') format('woff2');
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; background: #000; color: #999; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    main {
      min-height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; padding: 24px; text-align: center;
    }
    .brand { font-family: 'BitcountGridDouble', ui-monospace, monospace; font-size: 24px; letter-spacing: .05em; color: #fff; margin-bottom: 20px; }
    h1 { font-size: 18px; font-weight: 700; color: #fff; }
    p { font-size: 14px; line-height: 1.5; max-width: 260px; }
    button {
      margin-top: 16px; padding: 10px 20px; border: 0; cursor: pointer;
      background: #fff; color: #000; font: inherit; font-size: 12px; font-weight: 700;
    }
    button:hover { background: #ccc; }
    button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <span class="brand">The Cosmic</span>
    <h1>You're offline</h1>
    <p>Check your connection and try again. Pages you've opened before may still load once you're back online.</p>
    <button type="button" id="retry">Try again</button>
  </main>
  <script>
    document.getElementById('retry').addEventListener('click', function () { location.reload() })
    window.addEventListener('online', function () { location.reload() })
  </script>
</body>
</html>
